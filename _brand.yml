# ---------------------------------------------------------------------------
# ZEW Haus-CD (Quarto Brand, >= 1.6) — zentrale Farb- und Schriftquelle.
# Farben aus den offiziellen ZEW-RGB-Werten normalisiert (Hex aus RGB).
# Semantik der Daten-Viz: "signal" = übertragenes Preissignal, "diluted" = Verlust/Leakage.
# HINWEIS: Die ZEW-CD führt KEIN Rot. Für das negative Semantik-Feld wird daher Grau
# verwendet, nicht ein markenfremdes Rot.
# SCHRIFT: derzeit System-Schrift (DSGVO-sauber, keine Google-Fonts). Sobald die ZEW-
# Hausschrift als WOFF2 vorliegt, unter theme/fonts/ ablegen und hier via source: file
# referenzieren.
# ---------------------------------------------------------------------------
color:
  palette:
    zew-green:      "#c8d202"   # ZEW Green/Yellow (primary signature color)
    zew-grey:       "#9c9e9f"   # ZEW Medium Gray (for muted text & secondary data series)
    zew-eisblau:    "#abdadc"   # ZEW Light/Ice Blue (for third data series/accents)
    zew-intrans:    "#35484f"   # ZEW Dark Slate/Anthrazit (primary text & dark headings)
  foreground: zew-intrans
  background: "#FFFFFF"
  primary: zew-green
  secondary: zew-grey

typography:
  fonts:
    - family: Linux Libertine
      source: file
      files:
        - fonts/LinLibertine_R.ttf
        - fonts/LinLibertine_RB.ttf
        - fonts/LinLibertine_RI.ttf
    - family: Calibri
      source: file
      files:
        - fonts/calibri.ttf
        - fonts/calibrib.ttf
        - fonts/calibrii.ttf
        - fonts/calibriz.ttf
  base:
    family: Linux Libertine
    size: 1.05rem
  headings:
    family: Calibri
    weight: 600
