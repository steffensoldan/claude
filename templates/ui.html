<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Befund verfeinern - {{ title }}</title>
<style>
  :root {
    --bg: #0B132B;
    --card-bg: rgba(28, 37, 65, 0.4);
    --card-border: rgba(91, 192, 190, 0.15);
    --primary: #5BC0BE;
    --text: #F4F4F9;
    --text-muted: #8E9AAF;
    --user-msg: rgba(91, 192, 190, 0.15);
    --bot-msg: rgba(28, 37, 65, 0.6);
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  
  /* --- Header --- */
  header {
    background: rgba(11, 19, 43, 0.8); border-bottom: 1px solid var(--card-border);
    padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
    backdrop-filter: blur(8px); z-index: 10;
  }
  .title-group h1 { margin: 0; font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; }
  .title-group .slug { margin: 2px 0 0 0; font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
  
  .btn-back {
    text-decoration: none; background: transparent; color: var(--text-muted);
    border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 4px;
    font-size: 0.9rem; font-weight: 600; transition: color 0.2s, border-color 0.2s;
  }
  .btn-back:hover { color: var(--text); border-color: var(--text-muted); }
  
  .btn-share {
    text-decoration: none; background: var(--primary); color: var(--bg);
    padding: 8px 16px; border-radius: 4px; font-size: 0.9rem; font-weight: 700;
    transition: opacity 0.2s;
  }
  .btn-share:hover { opacity: 0.9; }

  /* --- Main Container --- */
  .main-container {
    display: flex; flex: 1; overflow: hidden;
  }
  
  /* --- Left: Preview Frame --- */
  .preview-pane {
    flex: 3; background: #fff; position: relative; border-right: 1px solid var(--card-border);
    display: flex; flex-direction: column;
  }
  .preview-pane iframe {
    width: 100%; height: 100%; border: none; background: #fff;
  }
  
  /* --- Right: Chat Pane --- */
  .chat-pane {
    flex: 2; min-width: 360px; max-width: 550px; display: flex; flex-direction: column;
    background: rgba(28, 37, 65, 0.2); backdrop-filter: blur(10px);
  }
  
  /* --- Chat Message Area --- */
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  
  .message {
    padding: 14px 18px; border-radius: 8px; max-width: 85%; font-size: 0.95rem; line-height: 1.5;
  }
  .message.user {
    background: var(--user-msg); border: 1px solid rgba(91, 192, 190, 0.25);
    align-self: flex-end; color: var(--text);
  }
  .message.bot {
    background: var(--bot-msg); border: 1px solid var(--card-border);
    align-self: flex-start; color: var(--text-muted);
  }
  .message.bot strong { color: var(--text); }
  .message .time {
    display: block; font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; text-align: right;
  }
  
  /* --- Chat Form Input --- */
  .chat-input-area {
    border-top: 1px solid var(--card-border); padding: 18px; background: rgba(11, 19, 43, 0.6);
  }
  .chat-input-area form {
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-input-area textarea {
    width: 100%; height: 80px; padding: 12px;
    background: rgba(11, 19, 43, 0.5); border: 1px solid var(--card-border);
    border-radius: 6px; color: var(--text); font-family: inherit; font-size: 0.95rem;
    resize: none; box-sizing: border-box;
  }
  .chat-input-area textarea:focus { outline: none; border-color: var(--primary); }
  
  .chat-actions {
    display: flex; justify-content: flex-end; align-items: center; gap: 12px;
  }
  button.btn-submit {
    background: var(--primary); color: var(--bg); border: none;
    padding: 10px 20px; font-size: 0.92rem; font-weight: 700;
    border-radius: 4px; cursor: pointer; transition: opacity 0.2s;
  }
  button.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  
  /* --- Inner Loading overlay inside chat --- */
  .chat-loading {
    display: none; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--primary);
  }
  .spinner-small {
    width: 16px; height: 16px; border: 2px solid rgba(91, 192, 190, 0.2);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div>
    <a href="/wisskomm" class="btn-back">&larr; Dashboard</a>
  </div>
  <div class="title-group">
    <h1>{{ title }}</h1>
    <div class="slug">Sitzung: {{ slug }}</div>
  </div>
  <div>
    <a href="/wisskomm/view/{{ slug }}/index.html" class="btn-share" target="_blank">Vollbild & Teilen ↗</a>
  </div>
</header>

<div class="main-container">
  <div class="preview-pane">
    <iframe src="/wisskomm/view/{{ slug }}/index.html" id="previewIframe"></div>
  </div>

  <div class="chat-pane">
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <strong>System</strong><br>
        Befund wurde erfolgreich importiert. Nutze das Eingabefeld unten, um Korrekturen und Anpassungswünsche für die HTML-Darstellung mitzuteilen.
      </div>
      
      {% for msg in history %}
        {% if msg.role == 'user' %}
          <div class="message user">
            {{ msg.content }}
          </div>
        {% elif msg.role == 'assistant' %}
          <div class="message bot">
            <strong>Claude (System)</strong><br>
            Das HTML-Template wurde basierend auf Deinen Wünschen neu generiert.
          </div>
        {% endif %}
      {% endfor %}
    </div>

    <div class="chat-input-area">
      <form id="refineForm">
        <textarea id="feedback" name="feedback" placeholder="Z. B.: Ändere den Titel zu '...' / Diagramm 1 auf 'EU mengenbasiert' filtern..." required></textarea>
        <div class="chat-actions">
          <div class="chat-loading" id="chatLoading">
            <div class="spinner-small"></div>
            <span>Änderungen werden eingearbeitet...</span>
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">Absenden</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const refineForm = document.getElementById("refineForm");
  const feedbackInput = document.getElementById("feedback");
  const submitBtn = document.getElementById("submitBtn");
  const chatLoading = document.getElementById("chatLoading");
  const chatMessages = document.getElementById("chatMessages");
  const previewIframe = document.getElementById("previewIframe");
  const slug = "{{ slug }}";

  // Scroll to bottom of chat
  chatMessages.scrollTop = chatMessages.scrollHeight;

  refineForm.onsubmit = async function(e) {
    e.preventDefault();
    const feedback = feedbackInput.value.strip ? feedbackInput.value.strip() : feedbackInput.value;
    if (!feedback) return;

    // UI-Zustand anpassen
    submitBtn.disabled = true;
    feedbackInput.disabled = true;
    chatLoading.style.display = "flex";

    // User Nachricht im Chat einfügen
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = feedback;
    chatMessages.appendChild(userMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    feedbackInput.value = "";

    try {
      const res = await fetch(`/wisskomm/refine/${slug}`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ feedback: feedback })
      });

      if (res.ok) {
        // Bot/System Bestätigung einfügen
        const botMsg = document.createElement("div");
        botMsg.className = "message bot";
        botMsg.innerHTML = "<strong>Claude (System)</strong><br>Änderungen wurden erfolgreich eingearbeitet. Vorschau wird aktualisiert.";
        chatMessages.appendChild(botMsg);
        
        // Iframe neu laden
        previewIframe.src = previewIframe.src;
      } else {
        alert("Fehler bei der Einarbeitung der Änderungen.");
      }
    } catch (err) {
      console.error(err);
      alert("Netzwerkfehler.");
    } finally {
      submitBtn.disabled = false;
      feedbackInput.disabled = false;
      chatLoading.style.display = "none";
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  };
</script>
</body>
</html>
